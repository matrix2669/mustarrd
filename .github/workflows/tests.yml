name: Tests

on:
  # Every pull request, whatever it targets. Restricting this to PRs against
  # main left stacked PRs (each based on the one below it) with no run at all:
  # main requires the "tests" check, a base change alone does not trigger a
  # workflow, and the PR sits blocked on a check that never starts. A run is
  # recorded against the head commit, so a stacked PR that passed while it
  # pointed at its parent still satisfies main once it is retargeted.
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend
