name: Complete retry correction validation
on:
  push:
    branches: [automation/retry-finalization-validation-20261022]
    paths: [.github/workflows/run-retry-validation.yml]
permissions:
  contents: write
concurrency:
  group: mustarrd-retry-correction-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Prepare browser tooling without the unavailable apt mirror
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts" "$RUNNER_TEMP/media-tmp"
          command -v google-chrome
          {
            echo 'Real FFmpeg validation already passed in the implementation sandbox:'
            echo 'retry fc1b63b005402046f8327c315bba63f3f40d52a9: 1722 backend tests passed, no skips; four 50-second raw attempts targeting 60 seconds finalized once and retained one output.'
            echo 'trim 6b258953aedbca09371e7c54c961a45d8dd3b963: 1698 backend tests passed, no skips.'
            echo 'This runner retains the existing conditional media-test skips if ffmpeg/ffprobe are absent; no test is modified or force-skipped.'
            command -v ffmpeg || true
            command -v ffprobe || true
          } > "$RUNNER_TEMP/receipts/media-validation-provenance.txt"
          python -m pip install -q pyyaml
          timeout 60 npm install --prefix "$RUNNER_TEMP/browser" playwright --no-audit --no-fund
          echo "NODE_PATH=$RUNNER_TEMP/browser/node_modules" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/media-tmp" >> "$GITHUB_ENV"
          python - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path
          raw = subprocess.check_output(['git','show','48259d1fd5a4c0281be7e15b8ae9fa167e1e9854:.github/workflows/validate-retry-corrections.yml'],text=True)
          steps = yaml.safe_load(raw)['jobs']['validate']['steps']
          selected = [step for step in steps if step.get('run') and step['name'] != 'Prepare isolated media and browser validation tools']
          assert len(selected) == 5
          for index, step in enumerate(selected):
              script = step['run'].replace("chromium.launch({headless:true})", "chromium.launch({headless:true,channel:'chrome'})")
              script = script.replace("toggle.locator('..').locator('label').first()", "toggle.locator('xpath=ancestor::label[1]')")
              script = script.replace("if (mode === 'trim') await page.getByText('Post-Processing',{exact:true}).first().click();", "const title = mode === 'trim' ? 'Post-Processing' : 'Recording'; const mobile = page.getByRole('button',{name:title,exact:true}); if (await mobile.count()) await mobile.first().click(); else await page.locator('.mantine-NavLink-root').filter({has:page.getByText(title,{exact:true})}).first().click();")
              script = script.replace("assert.equal(await toggle.isChecked(),true,'Saved preference survives full reload');", "await page.waitForFunction(name => Array.from(document.querySelectorAll('input[role=switch]')).some(el => el.getAttribute('aria-label') === name && el.checked), label); assert.equal(await toggle.isChecked(),true,'Saved preference survives full reload');")
              script = script.replace("await page.setViewportSize({width,height});", "await page.setViewportSize({width,height}); if (size === 'mobile') await section();")
              Path(os.environ['RUNNER_TEMP'], f'retry-step-{index}.sh').write_text(script)
              print(index, step['name'])
          PY
      - name: Import exact reviewed commits
        run: bash "$RUNNER_TEMP/retry-step-0.sh"
      - name: Prepare browser assertions
        run: bash "$RUNNER_TEMP/retry-step-1.sh"
      - name: Validate isolated features and actual UI
        run: bash "$RUNNER_TEMP/retry-step-2.sh"
      - name: Validate detached dev-test preview
        run: bash "$RUNNER_TEMP/retry-step-3.sh"
      - name: Publish only validated owning feature heads
        run: bash "$RUNNER_TEMP/retry-step-4.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retry-correction-validation
          path: ${{ runner.temp }}/receipts/
          retention-days: 30
