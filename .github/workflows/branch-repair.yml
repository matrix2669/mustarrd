name: Branch Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'automation/repair-pr405' || github.head_ref == 'automation/repair-pr407')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preserve repair helper
        run: cp .github/repair_pr_branch.py /tmp/repair_pr_branch.py

      - name: Prepare final branch tree
        run: python /tmp/repair_pr_branch.py prepare "$GITHUB_HEAD_REF"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Publish tested branch
        run: python /tmp/repair_pr_branch.py publish "$GITHUB_HEAD_REF"
