name: Diagnose PR 420 dev-test integration

on:
  pull_request:
    branches:
      - automation/pr420-dev-test-integration

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev-test integration base
        uses: actions/checkout@v6
        with:
          ref: automation/pr420-dev-test-integration
          fetch-depth: 0

      - name: Attempt merge and report conflicts
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin feature/comskip-runtime-config
          git config merge.conflictstyle diff3
          git merge --no-ff --no-commit origin/feature/comskip-runtime-config
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "MERGE_CLEAN"
            git diff --stat --cached
            exit 0
          fi

          echo "MERGE_CONFLICTS"
          git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            echo
            echo "===== $path ====="
            grep -n -C 12 -E '^(<<<<<<<|\|\|\|\|\|\|\||=======|>>>>>>>)' "$path" || true
          done < /tmp/conflicts.txt
          exit 1
