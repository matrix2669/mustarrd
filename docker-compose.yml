services:
  app:
    image: ghcr.io/razzamatazm/mustarrd/backend:latest
    ports:
      - "4177:4177"
    volumes:
      # App config + database (SQLite)
      - ./config:/app/config
      # Working download folder (in-progress + temp files)
      - ./downloads:/app/downloads
      # Final completed output folder (change host path to your media location)
      - ./completed:/app/completed
    # Intel/AMD iGPU acceleration on Linux (VA-API/QSV)
    devices:
      - /dev/dri:/dev/dri # For Intel Integrated GPU Transcoding
    environment:
      - LIBVA_DRIVER_NAME=iHD # Use i965 if iHD fails on older Intel iGPUs.
      # App timezone used for EPG display (defaults to UTC if unset).
      # - CATCHUP_TIMEZONE=America/Los_Angeles
      # Container/system timezone (used for logs, cron-like tools, etc.).
      - TZ=America/Los_Angeles
      # Match host user/group IDs to avoid permission issues on mounted volumes.
      - PUID=1000
      - PGID=1000
      # Session secret is auto-generated on first run and persisted to ./config
      # so sessions survive restarts automatically. Only set this manually if you
      # need to share a secret across multiple instances or rotate it on demand.
      # - CATCHUP_SESSION_SECRET=your-secret-here
      # Comma-separated CORS origins. Only needed if your frontend is accessed
      # from a non-localhost address (e.g. a LAN IP or custom domain).
      # - CATCHUP_CORS_ORIGINS=http://192.168.1.50:4178
    restart: unless-stopped
