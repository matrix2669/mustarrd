services:
  backend:
    image: ghcr.io/razzamatazm/mustarrd/backend:latest
    ports:
      - "4177:8000"
    volumes:
      - ./config:/app/config
      - ./downloads:/app/downloads
    environment:
      - CATCHUP_DATABASE_URL=sqlite+aiosqlite:///./config/catchup_dvr.db
      - CATCHUP_DEFAULT_DOWNLOAD_FOLDER=/app/downloads
    restart: unless-stopped

  frontend:
    image: ghcr.io/razzamatazm/mustarrd/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
